# Railway build config for the device dashboard (server/).
#
# The repo root also has its own requirements.txt (on-device app deps: PySide6,
# lgpio, evdev — GPIO/Qt libraries that won't build on Railway's container).
# Nixpacks' Python auto-detection would pick that one up by default, so this
# file pins the install step to server/requirements.txt instead, which is
# deliberately independent (fastapi/uvicorn/sqlite only, no hardware deps).
#
# See railway.json for the start command / health check, and server/README.md
# for the "Deploy to Railway" section (env vars, volume mount for SQLite).

[phases.setup]
nixPkgs = ["python312", "python312Packages.pip"]

[phases.install]
cmds = ["python3.12 -m pip install --no-cache-dir -r server/requirements.txt"]

[start]
cmd = "uvicorn server.main:app --host 0.0.0.0 --port $PORT"
