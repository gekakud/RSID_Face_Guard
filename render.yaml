# Render blueprint for the device dashboard (server/).
#
# The disk is not optional: Render's filesystem is ephemeral, so without it the
# SQLite database -- and every registered device -- is wiped on each deploy.
#
# Set in the Render dashboard, not here:
#   ADMIN_USER / ADMIN_PASSWORD  -> enables HTTP Basic on the dashboard
#   PUBLIC_BASE_URL              -> this service's public https URL, included
#                                   in unsigned installation QRs as serverLink.
services:
  - type: web
    name: face-guard-dashboard
    runtime: python
    plan: free
    buildCommand: pip install -r server/requirements.txt
    startCommand: uvicorn server.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"
      - key: DB_PATH
        value: /var/data/faceguard.db
      - key: HEARTBEAT_TIMEOUT_SEC
        value: "90"
      - key: PUBLIC_BASE_URL
        value: https://rsid-face-guard.onrender.com
      - key: USER_STORE_FILE
        value: /var/data/server_user_database.json
      - key: ADMIN_USER
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
    disk:
      name: faceguard-data
      mountPath: /var/data
      sizeGB: 1
